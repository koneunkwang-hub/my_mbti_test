<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 성격 분석 연구소</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary: #6C5CE7; 
            --secondary: #a29bfe;
            --bg: #f1f2f6;
            --success: #00b894;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* 헤더 */
        h1 { font-size: 28px; color: #333; margin-bottom: 5px; }
        .desc { color: #666; margin-bottom: 30px; font-size: 14px; }

        /* 메뉴 버튼 스타일 */
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 20px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
            position: relative;
        }
        .menu-btn:hover { border-color: var(--secondary); transform: translateY(-2px); }
        .menu-btn.completed { border-color: var(--success); background-color: #f0fff4; }
        
        .icon { font-size: 24px; margin-right: 15px; }
        .info h3 { margin: 0; font-size: 18px; color: #333; }
        .info p { margin: 5px 0 0; font-size: 13px; color: #888; }
        .status { font-weight: bold; color: #ccc; }
        .completed .status { color: var(--success); }

        /* 최종 보고서 버튼 (숨김 상태) */
        #final-report-btn {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            border: none;
            width: 100%;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* 퀴즈 영역 */
        .btn-option {
            width: 100%; padding: 16px; margin-bottom: 10px;
            border: 2px solid #eee; border-radius: 10px;
            background: white; font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .btn-option:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* 결과 카드 스타일 */
        .result-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: left;
        }
        .result-card h4 { margin: 0 0 10px; color: var(--primary); }
        
        .final-summary {
            background: #fff8e1; border: 2px solid #ffeaa7;
            padding: 20px; border-radius: 15px; margin-top: 20px;
            line-height: 1.6; word-break: keep-all; text-align: left;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="dashboard">
            <h1>통합 성격 분석 리포트</h1>
            <p class="desc">3가지 검사를 모두 완료하면 종합 분석 보고서가 발행됩니다.</p>
            
            <button class="menu-btn" id="btn-mbti" onclick="startTest('mbti')">
                <div style="display:flex; align-items:center;">
                    <span class="icon">🧩</span>
                    <div class="info">
                        <h3>MBTI 검사</h3>
                        <p>16가지 성격 유형 분석</p>
                    </div>
                </div>
                <div class="status" id="status-mbti">미완료</div>
            </button>

            <button class="menu-btn" id="btn-enneagram" onclick="startTest('enneagram')">
                <div style="display:flex; align-items:center;">
                    <span class="icon">⭐</span>
                    <div class="info">
                        <h3>에니어그램</h3>
                        <p>9가지 자아와 본능 탐구</p>
                    </div>
                </div>
                <div class="status" id="status-enneagram">미완료</div>
            </button>

            <button class="menu-btn" id="btn-big5" onclick="startTest('big5')">
                <div style="display:flex; align-items:center;">
                    <span class="icon">🌊</span>
                    <div class="info">
                        <h3>Big 5 검사</h3>
                        <p>심리학적 5가지 척도</p>
                    </div>
                </div>
                <div class="status" id="status-big5">미완료</div>
            </button>

            <button id="final-report-btn" class="hidden" onclick="showFinalReport()">
                📑 종합 분석 보고서 확인하기
            </button>
        </div>

        <div id="quiz-area" class="hidden">
            <h2 id="question-text" style="margin: 40px 0; line-height:1.4;">질문</h2>
            <div id="options-area">
                </div>
        </div>

        <div id="step-result-area" class="hidden">
            <h2 style="margin-top:50px;">검사 완료!</h2>
            <p>결과가 시스템에 저장되었습니다.</p>
            <div style="font-size: 50px; margin: 20px;">💾</div>
            <button class="btn-option" style="background:var(--primary); color:white;" onclick="goToDashboard()">메인으로 돌아가기</button>
        </div>

        <div id="final-report-area" class="hidden">
            <h2>종합 성격 분석 보고서</h2>
            <p style="color:#666; font-size:14px;">Gemini AI Analysis</p>
            
            <div class="final-summary">
                <h3 style="margin-top:0;">🤖 AI 심층 분석</h3>
                <p id="summary-text" style="font-size:16px; color:#333;">분석 중...</p>
            </div>

            <div class="result-card">
                <h4>🧩 MBTI 결과</h4>
                <div id="report-mbti" style="font-size:20px; font-weight:bold;"></div>
            </div>
            
            <div class="result-card">
                <h4>⭐ 에니어그램 결과</h4>
                <div id="report-enneagram" style="font-size:20px; font-weight:bold;"></div>
            </div>

            <div class="result-card">
                <h4>🌊 Big 5 주요 특징</h4>
                <div id="report-big5"></div>
            </div>

            <button class="btn-option" style="background:#333; color:white; margin-top:20px;" onclick="location.reload()">처음부터 다시 하기</button>
        </div>

    </div>

    <script>
        // ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
        // [여기에 발급받은 Gemini API 키를 넣어주세요!]
        const API_KEY = "AIzaSyDhD8TuMVJ5JfIdwe-k9PXwjfnljpMnaxA"; 
        // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

        // 데이터 저장소
        let userResults = {
            mbti: null,
            enneagram: null,
            big5: null
        };

        let currentTest = "";
        let currentStep = 0;
        let tempScore = {};

        // 질문 리스트
        const questions = {
            mbti: [
                { text: "사람들 사이에서 에너지를 얻나요?", type: "EI" },
                { text: "현실적인 데이터보다 상상을 즐기나요?", type: "SN" },
                { text: "감정보다 논리가 중요한가요?", type: "TF" },
                { text: "여행 계획을 꼼꼼히 세우나요?", type: "JP" }
            ],
            enneagram: [
                { text: "완벽하지 않으면 견딜 수 없나요?", type: "1" },
                { text: "타인을 돕는 것에서 기쁨을 느끼나요?", type: "2" },
                { text: "성취와 성공이 가장 중요한가요?", type: "3" },
                { text: "남들과 다른 특별한 존재이고 싶나요?", type: "4" }
            ],
            big5: [
                { text: "새로운 경험을 즐기는 편인가요?", type: "Openness" },
                { text: "약속이나 규칙을 철저히 지키나요?", type: "Conscientiousness" },
                { text: "처음 보는 사람과도 말을 잘 하나요?", type: "Extraversion" },
                { text: "다른 사람의 감정에 잘 공감하나요?", type: "Agreeableness" },
                { text: "걱정이 많고 예민한 편인가요?", type: "Neuroticism" }
            ]
        };

        function startTest(type) {
            if (userResults[type] !== null) {
                if(!confirm("이미 완료한 검사입니다. 다시 하시겠습니까?")) return;
            }
            currentTest = type;
            currentStep = 0;
            
            if(type === 'mbti') tempScore = { EI:0, SN:0, TF:0, JP:0 };
            else if(type === 'enneagram') tempScore = { "1":0, "2":0, "3":0, "4":0 };
            else if(type === 'big5') tempScore = { Openness:0, Conscientiousness:0, Extraversion:0, Agreeableness:0, Neuroticism:0 };

            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const qList = questions[currentTest];
            if (currentStep < qList.length) {
                document.getElementById('question-text').innerText = qList[currentStep].text;
                document.getElementById('options-area').innerHTML = `
                    <button class="btn-option" onclick="nextQuestion(1)">매우 그렇다</button>
                    <button class="btn-option" onclick="nextQuestion(0.5)">그렇다</button>
                    <button class="btn-option" onclick="nextQuestion(-0.5)">아니다</button>
                    <button class="btn-option" onclick="nextQuestion(-1)">매우 아니다</button>
                `;
            } else {
                finishCurrentTest();
            }
        }

        function nextQuestion(score) {
            const type = questions[currentTest][currentStep].type;
            tempScore[type] += score;
            currentStep++;
            showQuestion();
        }

        function finishCurrentTest() {
            let result = "";
            if (currentTest === 'mbti') {
                result += tempScore.EI > 0 ? "E" : "I";
                result += tempScore.SN > 0 ? "N" : "S";
                result += tempScore.TF > 0 ? "T" : "F";
                result += tempScore.JP > 0 ? "J" : "P";
            } 
            else if (currentTest === 'enneagram') {
                let maxType = Object.keys(tempScore).reduce((a, b) => tempScore[a] > tempScore[b] ? a : b);
                result = maxType + "번 유형";
            } 
            else if (currentTest === 'big5') {
                let maxTrait = Object.keys(tempScore).reduce((a, b) => tempScore[a] > tempScore[b] ? a : b);
                result = maxTrait + " 성향 높음";
            }

            userResults[currentTest] = result;
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('step-result-area').classList.remove('hidden');
        }

        function goToDashboard() {
            document.getElementById('step-result-area').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            if(userResults.mbti) {
                document.getElementById('btn-mbti').classList.add('completed');
                document.getElementById('status-mbti').innerText = "완료 ✅";
            }
            if(userResults.enneagram) {
                document.getElementById('btn-enneagram').classList.add('completed');
                document.getElementById('status-enneagram').innerText = "완료 ✅";
            }
            if(userResults.big5) {
                document.getElementById('btn-big5').classList.add('completed');
                document.getElementById('status-big5').innerText = "완료 ✅";
            }

            if (userResults.mbti && userResults.enneagram && userResults.big5) {

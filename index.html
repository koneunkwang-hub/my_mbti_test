<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>종합 성격 유형 테스트</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary: #6C5CE7; 
            --secondary: #a29bfe;
            --bg: #dfe6e9;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }
        
        /* 메인 메뉴 스타일 */
        h1 { font-size: 28px; color: #333; margin-bottom: 10px; }
        .desc { color: #666; margin-bottom: 30px; }
        
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #eee;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
        }
        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }
        .menu-icon { font-size: 24px; margin-right: 15px; }
        .menu-title { font-size: 18px; font-weight: bold; color: #333; }
        .menu-sub { font-size: 13px; color: #888; margin-top: 5px; }

        /* 공통 버튼 */
        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-option {
            background-color: white;
            color: #333;
            border: 2px solid #eee;
            margin-bottom: 10px;
        }
        .btn-option:hover { background-color: #f0f0f0; border-color: #ccc; }

        /* 결과 화면 */
        .result-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }
        .score-bar {
            background: #eee;
            height: 10px;
            border-radius: 5px;
            margin: 5px 0 15px 0;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: 1s;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="main-menu">
            <h1>성격 연구소</h1>
            <p class="desc">나를 알아보는 3가지 심리 테스트</p>
            
            <button class="menu-btn" onclick="startTest('mbti')">
                <span class="menu-icon">🧩</span>
                <div>
                    <div class="menu-title">MBTI 성격 유형</div>
                    <div class="menu-sub">16가지 유형으로 알아보는 나의 성향</div>
                </div>
            </button>

            <button class="menu-btn" onclick="startTest('enneagram')">
                <span class="menu-icon">⭐</span>
                <div>
                    <div class="menu-title">에니어그램</div>
                    <div class="menu-sub">9가지 본능과 자아 찾기</div>
                </div>
            </button>

            <button class="menu-btn" onclick="startTest('big5')">
                <span class="menu-icon">🌊</span>
                <div>
                    <div class="menu-title">Big 5 (5요인)</div>
                    <div class="menu-sub">심리학계에서 가장 신뢰하는 검사</div>
                </div>
            </button>
        </div>

        <div id="quiz-area" class="hidden">
            <h2 id="question-text" style="margin-bottom:40px;">질문 내용</h2>
            <button class="btn btn-option" onclick="nextQuestion(1)">매우 그렇다</button>
            <button class="btn btn-option" onclick="nextQuestion(0.5)">그렇다</button>
            <button class="btn btn-option" onclick="nextQuestion(0)">보통이다</button>
            <button class="btn btn-option" onclick="nextQuestion(-0.5)">아니다</button>
            <button class="btn btn-option" onclick="nextQuestion(-1)">매우 아니다</button>
        </div>

        <div id="result-area" class="hidden">
            <h2 id="result-title" style="color:var(--primary)">결과 제목</h2>
            <div id="result-content" class="result-box">
                </div>
            <button class="btn" onclick="location.reload()">메인으로 돌아가기</button>
        </div>

    </div>

    <script>
        // 데이터 저장소
        let currentTestType = "";
        let currentStep = 0;
        let totalScore = {}; // 점수 저장용

        // === 1. 질문 리스트 (간단 버전) ===
        // 실제로는 질문을 더 많이 추가해야 정확해집니다.
        const questions = {
            mbti: [
                { text: "사람들과 어울리는 것이 혼자 있는 것보다 좋은가요?", type: "EI" },
                { text: "현실적인 데이터보다 미래의 가능성을 상상하는 게 좋은가요?", type: "SN" },
                { text: "결정을 내릴 때 감정보다는 논리가 우선인가요?", type: "TF" },
                { text: "여행 갈 때 세부 계획을 철저히 세우나요?", type: "JP" }
            ],
            enneagram: [
                { text: "완벽하지 않은 것을 보면 고치고 싶은 충동을 느끼나요?", type: "T1" },
                { text: "다른 사람을 돕지 않으면 죄책감이 드나요?", type: "T2" },
                { text: "성공과 성취가 나의 가치를 증명한다고 생각하나요?", type: "T3" },
                { text: "나는 남들과 다른 특별한 존재라고 느끼나요?", type: "T4" }
                // 9번 유형까지 질문을 추가해야 함
            ],
            big5: [
                { text: "나는 새로운 경험이나 예술적인 것에 호기심이 많나요?", type: "Openness" },
                { text: "나는 계획적이고 성실하게 일을 처리하나요?", type: "Conscientiousness" },
                { text: "나는 사람들과 대화하는 것을 즐기나요?", type: "Extraversion" },
                { text: "나는 타인의 감정에 공감을 잘 하나요?", type: "Agreeableness" },
                { text: "나는 걱정이 많고 스트레스를 잘 받나요?", type: "Neuroticism" }
            ]
        };

        // === 2. 테스트 시작 ===
        function startTest(type) {
            currentTestType = type;
            currentStep = 0;
            
            // 점수 초기화
            if(type === 'mbti') totalScore = { EI:0, SN:0, TF:0, JP:0 };
            else if(type === 'enneagram') totalScore = { T1:0, T2:0, T3:0, T4:0, T5:0, T6:0, T7:0, T8:0, T9:0 };
            else if(type === 'big5') totalScore = { Openness:0, Conscientiousness:0, Extraversion:0, Agreeableness:0, Neuroticism:0 };

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            showQuestion();
        }

        // === 3. 질문 표시 ===
        function showQuestion() {
            const qList = questions[currentTestType];
            if (currentStep < qList.length) {
                document.getElementById('question-text').innerText = qList[currentStep].text;
            } else {
                showResult();
            }
        }

        // === 4. 다음 질문으로 ===
        function nextQuestion(score) {
            const qList = questions[currentTestType];
            const type = qList[currentStep].type;
            
            // 점수 누적
            totalScore[type] += score;
            
            currentStep++;
            showQuestion();
        }

        // === 5. 결과 계산 및 표시 ===
        function showResult() {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
            
            let html = "";
            const title = document.getElementById('result-title');

            if (currentTestType === 'mbti') {
                title.innerText = "당신의 MBTI 유형";
                let mbti = "";
                mbti += totalScore.EI > 0 ? "E" : "I";
                mbti += totalScore.SN > 0 ? "N" : "S";
                mbti += totalScore.TF > 0 ? "T" : "F";
                mbti += totalScore.JP > 0 ? "J" : "P";
                html = `<h1 style="font-size:40px; margin:20px 0;">${mbti}</h1>`;
                html += `<p>당신의 성향을 분석한 결과입니다.</p>`;
            } 
            else if (currentTestType === 'enneagram') {
                title.innerText = "당신의 에니어그램";
                // 가장 높은 점수 찾기
                let maxType = Object.keys(totalScore).reduce((a, b) => totalScore[a] > totalScore[b] ? a : b);
                html = `<h1>${maxType.replace('T', '')}번 유형</h1><p>당신의 핵심 동기는 이 유형에 가깝습니다.</p>`;
            } 
            else if (currentTestType === 'big5') {
                title.innerText = "Big 5 성격 요인";
                // 그래프로 보여주기
                for (let [key, value] of Object.entries(totalScore)) {
                    // 점수(-1 ~ 1)를 퍼센트(0 ~ 100)로 변환 (예시 로직)
                    let percent = (value + 1) * 50; 
                    if(percent > 100) percent = 100;
                    if(percent < 0) percent = 0;
                    
                    html += `<div style="text-align:left; font-weight:bold;">${key}</div>
                             <div class="score-bar"><div class="score-fill" style="width:${percent}%"></div></div>`;
                }
            }

            document.getElementById('result-content').innerHTML = html;
        }
    </script>
</body>
</html>
